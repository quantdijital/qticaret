# Local development services (docs/08). Mailpit and MinIO arrive in F0.3.
# The password comes from infra/docker/.env (template: env.example). Ports are
# off the defaults to avoid clashing with locally installed Postgres/Redis and
# bind to loopback only so the services are never exposed on the network.
name: qticaret-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in infra/docker/.env}
      POSTGRES_DB: qticaret
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
