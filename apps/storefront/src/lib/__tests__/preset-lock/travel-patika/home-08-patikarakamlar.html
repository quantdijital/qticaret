<!-- preset lock: travel-patika (docs/tema/bilesen-standardi.md §7) -->
<div class="group/look gf-look" data-ground="primary" data-align="center" data-qs="patikarakamlar">
  <section aria-label="Rakamlarla" class="gf-section">
    <div class="mx-auto w-full max-w-(--container) px-(--gutter) flex flex-col gap-(--head-gap)">
      <dl
        class="grid grid-cols-2 gap-x-(--gap-columns) gap-y-(--gap-rows) md:grid-cols-2 lg:grid-cols-4 lg:gap-x-0"
      >
        <div
          class="flex min-w-0 flex-col gap-2 group-data-[align=center]/look:items-center group-data-[align=center]/look:text-center border-t border-rule pt-5 lg:border-t-0 lg:border-l lg:px-(--gap-columns) lg:pt-0 lg:first:border-l-0 lg:first:pl-0"
        >
          <dt class="order-2 text-md font-semibold text-text">
            Rota
          </dt>
          <dd
            class="tabular order-1 text-[clamp(2.25rem,1.8vw+1.6rem,3.5rem)] leading-none font-extrabold tracking-(--tracking-display) break-words"
          >
            120+
          </dd>
          <dd aria-hidden="true" class="order-0 text-signal in-[.gf-stage]:text-signal-on-stage">
            <svg
              width="24"
              height="24"
              stroke-width="1.75"
              class="lucide lucide-map-pin size-8 shrink-0 lg:size-9"
              aria-hidden="true"
            />
          </dd>
        </div>
        <div
          class="flex min-w-0 flex-col gap-2 group-data-[align=center]/look:items-center group-data-[align=center]/look:text-center border-t border-rule pt-5 lg:border-t-0 lg:border-l lg:px-(--gap-columns) lg:pt-0 lg:first:border-l-0 lg:first:pl-0"
        >
          <dt class="order-2 text-md font-semibold text-text">
            Mutlu gezgin
          </dt>
          <dd
            class="tabular order-1 text-[clamp(2.25rem,1.8vw+1.6rem,3.5rem)] leading-none font-extrabold tracking-(--tracking-display) break-words"
          >
            8.000+
          </dd>
          <dd aria-hidden="true" class="order-0 text-signal in-[.gf-stage]:text-signal-on-stage">
            <svg
              width="24"
              height="24"
              stroke-width="1.75"
              class="lucide lucide-users size-8 shrink-0 lg:size-9"
              aria-hidden="true"
            />
          </dd>
        </div>
        <div
          class="flex min-w-0 flex-col gap-2 group-data-[align=center]/look:items-center group-data-[align=center]/look:text-center border-t border-rule pt-5 lg:border-t-0 lg:border-l lg:px-(--gap-columns) lg:pt-0 lg:first:border-l-0 lg:first:pl-0"
        >
          <dt class="order-2 text-md font-semibold text-text">
            Ortalama puan
          </dt>
          <dd
            class="tabular order-1 text-[clamp(2.25rem,1.8vw+1.6rem,3.5rem)] leading-none font-extrabold tracking-(--tracking-display) break-words"
          >
            4,8
          </dd>
          <dd aria-hidden="true" class="order-0 text-signal in-[.gf-stage]:text-signal-on-stage">
            <svg
              width="24"
              height="24"
              stroke-width="1.75"
              class="lucide lucide-star size-8 shrink-0 lg:size-9"
              aria-hidden="true"
            />
          </dd>
        </div>
        <div
          class="flex min-w-0 flex-col gap-2 group-data-[align=center]/look:items-center group-data-[align=center]/look:text-center border-t border-rule pt-5 lg:border-t-0 lg:border-l lg:px-(--gap-columns) lg:pt-0 lg:first:border-l-0 lg:first:pl-0"
        >
          <dt class="order-2 text-md font-semibold text-text">
            Kişilik gruplar
          </dt>
          <dd
            class="tabular order-1 text-[clamp(2.25rem,1.8vw+1.6rem,3.5rem)] leading-none font-extrabold tracking-(--tracking-display) break-words"
          >
            12
          </dd>
          <dd aria-hidden="true" class="order-0 text-signal in-[.gf-stage]:text-signal-on-stage">
            <svg
              width="24"
              height="24"
              stroke-width="1.75"
              class="lucide lucide-compass size-8 shrink-0 lg:size-9"
              aria-hidden="true"
            />
          </dd>
        </div>
      </dl>
    </div>
  </section>
</div>
