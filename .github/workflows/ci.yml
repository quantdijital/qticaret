# Lint, typecheck, unit tests, build and HTTP integration tests (F0.5).
# Third-party actions and images are pinned by commit SHA / digest
# (docs/04, after the 2026 tag-hijack of trivy-action); Renovate bumps them.
name: CI

on:
  push:
    paths-ignore: ["**/*.md", "docs/**", "adr/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: "0"
  MEDUSA_DISABLE_TELEMETRY: "true"
  TURBO_TELEMETRY_DISABLED: "1"
  # Syntactically valid config so medusa-config's env schema passes; the
  # integration job overrides what it needs. Secrets are generated per run.
  DATABASE_URL: postgres://postgres@localhost:5432/qticaret
  STORE_CORS: http://localhost:8000
  ADMIN_CORS: http://localhost:9000
  AUTH_CORS: http://localhost:9000,http://localhost:8000

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-24.04
    # Build ~2, lint and typecheck ~5, the tests one package at a time ~15 minutes
    timeout-minutes: 40
    # The rate limiter's Redis counters (an atomic Lua script) are tested
    # against a real Redis; the same pinned image as local dev
    services:
      redis:
        image: redis:7.4.11-alpine@sha256:57e4255cc971b1c8d6f8a6ca283ac01bc3ecdd914273ef6bfaede87aaecd6541
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_REDIS_URL: redis://localhost:6379/15
      # The control plane validates its env wherever it reads it (its build,
      # and unit tests of code that reads it, such as the rate limiter's
      # identity key): a public-looking domain and an https panel pass both
      # as deployed and as local. Build-time values only; nothing is served
      PLATFORM_DOMAIN: qticaret-ci.dev
      CP_PANEL_URL: https://cp.qticaret-ci.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Random per run and useless outside this job; masked all the same,
      # since every later step lists its env in the (public) log
      # (the control plane's keys too: its `medusa build` validates its env)
      - name: Generate throwaway secrets
        run: |
          for name in JWT_SECRET COOKIE_SECRET PII_ENCRYPTION_KEY PII_HASH_KEY CREDENTIALS_ENCRYPTION_KEY \
            AUTH_MFA_ENCRYPTION_KEY CP_HASH_KEY CP_MASTER_KEY; do
            value="$(openssl rand -hex 32)"
            # Masking only tidies the log: the values are worthless outside this
            # job, so a branch that stops workflow commands exposes nothing
            # nosemgrep: yaml.github-actions.security.audit.unsafe-add-mask-workflow-command.unsafe-add-mask-workflow-command
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
      - run: pnpm install --frozen-lockfile
      # The control plane's escrow recipient: a public age key whose identity
      # is thrown away at once, so nothing sealed to it can ever be opened
      - name: Throwaway escrow recipient
        run: >-
          echo "CP_ESCROW_RECIPIENTS=$(pnpm --silent --filter @qticaret/server-kit exec node --input-type=module
          -e 'import { generateIdentity, identityToRecipient } from "age-encryption";
          console.log(await identityToRecipient(await generateIdentity()))')" >> "$GITHUB_ENV"
      - run: pnpm format:check
      # The backend's tsconfig includes the query and container types Medusa
      # writes when it builds (.medusa/types; `medusa develop` writes them
      # locally): typecheck and lint run after them, not beside them.
      # A build is a release build: the apps' configs validate as deployed
      # (NODE_ENV unset), so the control plane also needs Redis (the service
      # above; nothing connects at build)
      - run: pnpm turbo run build
        env:
          REDIS_URL: redis://localhost:6379
      # --continue: every failing package is reported, not only the first
      - run: pnpm turbo run lint typecheck --continue
      # Product videos (adr/0069): the backend's unit tests run the real ffprobe
      # on clips ffmpeg makes in the test; without it they skip and say so
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      # One package's tests at a time: beside lint and typecheck the runner's
      # four cores starved the UI suites past their 5 s per-test timeout
      - run: pnpm turbo run test --continue --concurrency=1

  integration:
    name: Integration tests (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    # Side by side: each HTTP spec file boots Medusa (~45 s on a runner), and
    # there are about 290 of them; twelve shards of ~24 files take ~20 minutes
    strategy:
      fail-fast: false
      matrix:
        suite:
          [
            "HTTP 1/12",
            "HTTP 2/12",
            "HTTP 3/12",
            "HTTP 4/12",
            "HTTP 5/12",
            "HTTP 6/12",
            "HTTP 7/12",
            "HTTP 8/12",
            "HTTP 9/12",
            "HTTP 10/12",
            "HTTP 11/12",
            "HTTP 12/12",
            "modules",
          ]
    services:
      postgres:
        image: postgres:16.15-alpine@sha256:f4610795587492cd4fb887c2dc3de301b813278bb6f616992061141b5f15ac36
        env:
          # Ephemeral, job-scoped container: no password to manage or leak
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: qticaret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USERNAME: postgres
      DB_PASSWORD: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Random per run and useless outside this job; masked all the same,
      # since every later step lists its env in the (public) log. Staff 2FA
      # (adr/0040) needs its sealing key: the 2FA and team suites turn it on
      - name: Generate throwaway secrets
        run: |
          for name in JWT_SECRET COOKIE_SECRET PII_ENCRYPTION_KEY PII_HASH_KEY CREDENTIALS_ENCRYPTION_KEY \
            AUTH_MFA_ENCRYPTION_KEY; do
            value="$(openssl rand -hex 32)"
            # Masking only tidies the log: the values are worthless outside this
            # job, so a branch that stops workflow commands exposes nothing
            # nosemgrep: yaml.github-actions.security.audit.unsafe-add-mask-workflow-command.unsafe-add-mask-workflow-command
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
      - run: pnpm install --frozen-lockfile
      # Product videos (adr/0069): the video upload suite needs ffmpeg and
      # ffprobe on the server; any HTTP shard may hold it
      - name: Install ffmpeg
        if: matrix.suite != 'modules'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      # One jest worker, replaced when its heap grows (jest.config.js)
      - name: Run the suite
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          if [ "$SUITE" = modules ]; then
            pnpm --filter @qticaret/backend test:integration:modules
          else
            pnpm --filter @qticaret/backend test:integration:http --shard="${SUITE#HTTP }"
          fi

  e2e:
    name: Panel e2e (smoke, accessibility)
    runs-on: ubuntu-24.04
    # About 120 tests take 20 to 25 minutes on a runner (the accessibility pass alone ~11)
    timeout-minutes: 40
    # A real backend on a fresh database with the demo shop; the panel, built and
    # served by `vite preview`, proxies to it (apps/panel/e2e)
    services:
      postgres:
        image: postgres:16.15-alpine@sha256:f4610795587492cd4fb887c2dc3de301b813278bb6f616992061141b5f15ac36
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: qticaret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4.11-alpine@sha256:57e4255cc971b1c8d6f8a6ca283ac01bc3ecdd914273ef6bfaede87aaecd6541
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Generate throwaway secrets
        run: |
          for name in JWT_SECRET COOKIE_SECRET PII_ENCRYPTION_KEY PII_HASH_KEY CREDENTIALS_ENCRYPTION_KEY; do
            value="$(openssl rand -hex 32)"
            # Masking only tidies the log: the values are worthless outside this
            # job, so a branch that stops workflow commands exposes nothing
            # nosemgrep: yaml.github-actions.security.audit.unsafe-add-mask-workflow-command.unsafe-add-mask-workflow-command
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: pnpm --filter @qticaret/panel exec playwright install --with-deps chromium
      - name: Database and demo shop
        run: |
          pnpm --filter @qticaret/backend medusa db:migrate
          pnpm --filter @qticaret/backend seed:demo
          # A few days of orders: the order page's tests open one
          pnpm --filter @qticaret/backend seed:demo-orders days=3
      - name: Start the backend
        # Two browsers run ~120 tests from one address: past the admin's 1,200 requests a
        # minute per IP, /admin/users/me answered 429 and the panel showed its sign-in page
        # mid-run. LOAD_TEST scales per-IP limits up, on development only (lib/env.ts)
        env:
          NODE_ENV: development
          LOAD_TEST: "on"
        run: |
          pnpm --filter @qticaret/backend dev > backend.log 2>&1 &
          for attempt in $(seq 1 90); do
            if curl -fsS http://localhost:9000/health > /dev/null; then exit 0; fi
            sleep 2
          done
          # The end of it only: the log is public
          tail -n 100 backend.log
          exit 1
      # The panel built once and served by `vite preview`, which proxies to the backend as
      # the dev server does (preview.proxy defaults to server.proxy). The dev server serves
      # the app as separate, untransformed-until-asked modules on every one of the many page
      # loads the ~120 tests make, and the tests took 23 to over 38 minutes with it. Built in
      # development mode, so the i18n missing-key warnings the tests watch for stay on.
      # Playwright finds the server running and uses it (reuseExistingServer)
      - name: Build and serve the panel
        run: |
          pnpm --filter @qticaret/panel exec vite build --mode development
          pnpm --filter @qticaret/panel exec vite preview --port 5173 --strictPort > panel.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:5173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          tail -n 100 panel.log
          exit 1
      - run: pnpm --filter @qticaret/panel test:e2e
      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          # The report and traces live in dot directories, which are left out by default.
          # Not the backend's log: the artifact is public and nothing proves every line
          # of a dev server's log (Medusa's own included) goes through our redaction
          include-hidden-files: true
          path: |
            apps/panel/e2e/.report
            apps/panel/e2e/.results
          retention-days: 7
