# Lint, typecheck, unit tests, build and HTTP integration tests (F0.5).
# How the jobs are cut and what a branch may skip: adr/0081.
# Third-party actions and images are pinned by commit SHA / digest
# (docs/04, after the 2026 tag-hijack of trivy-action); Renovate bumps them.
name: CI

on:
  # Every push gets a result, notes too (scripts/ci-changes.sh skips the jobs
  # there): the one check a merge waits for, "CI", always arrives (adr/0081)
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: "0"
  MEDUSA_DISABLE_TELEMETRY: "true"
  TURBO_TELEMETRY_DISABLED: "1"
  # Syntactically valid config so medusa-config's env schema passes; the
  # integration job overrides what it needs. Secrets are generated per run.
  DATABASE_URL: postgres://postgres@localhost:5432/qticaret
  STORE_CORS: http://localhost:8000
  ADMIN_CORS: http://localhost:9000
  AUTH_CORS: http://localhost:9000,http://localhost:8000

jobs:
  # What this push needs (scripts/ci-changes.sh, adr/0081): a branch runs what
  # its changes can reach; dev, main and a manual run check everything.
  changes:
    name: Changed packages
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # The last green run of dev or main is asked of the API
    permissions:
      contents: read
      actions: read
    outputs:
      code: ${{ steps.changes.outputs.code }}
      integration: ${{ steps.changes.outputs.integration }}
      e2e: ${{ steps.changes.outputs.e2e }}
      filter: ${{ steps.changes.outputs.filter }}
      unit: ${{ steps.changes.outputs.unit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # On dev and main: the head of the branch's last green run. A push of
      # notes alone skips the jobs only when nothing but notes came since
      # that head, so it cannot stand in for a code push whose run it cancelled
      - id: green
        if: github.ref_name == 'dev' || github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=$GITHUB_REF_NAME&status=success&per_page=1" \
            -q '.workflow_runs[0].head_sha // ""' || true)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - id: changes
        env:
          CI_LAST_GREEN: ${{ steps.green.outputs.sha }}
        run: bash scripts/ci-changes.sh

  static:
    name: Format, build, lint, typecheck
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    # Build ~2, lint and typecheck ~5 minutes; less with turbo's cache
    timeout-minutes: 25
    env:
      TEST_REDIS_URL: redis://localhost:6379/15
      # The control plane validates its env wherever it reads it (its build,
      # and unit tests of code that reads it, such as the rate limiter's
      # identity key): a public-looking domain and an https panel pass both
      # as deployed and as local. Build-time values only; nothing is served
      PLATFORM_DOMAIN: qticaret-ci.dev
      CP_PANEL_URL: https://cp.qticaret-ci.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The changed packages are found against dev's history
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Random per run and useless outside this job; masked all the same,
      # since every later step lists its env in the (public) log
      # (the control plane's keys too: its `medusa build` validates its env)
      - name: Generate throwaway secrets
        run: |
          for name in JWT_SECRET COOKIE_SECRET PII_ENCRYPTION_KEY PII_HASH_KEY CREDENTIALS_ENCRYPTION_KEY \
            AUTH_MFA_ENCRYPTION_KEY CP_HASH_KEY CP_MASTER_KEY; do
            value="$(openssl rand -hex 32)"
            # Masking only tidies the log: the values are worthless outside this
            # job, so a branch that stops workflow commands exposes nothing
            # nosemgrep: yaml.github-actions.security.audit.unsafe-add-mask-workflow-command.unsafe-add-mask-workflow-command
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
      - run: pnpm install --frozen-lockfile
      # The control plane's escrow recipient: a public age key whose identity
      # is thrown away at once, so nothing sealed to it can ever be opened
      - name: Throwaway escrow recipient
        run: >-
          echo "CP_ESCROW_RECIPIENTS=$(pnpm --silent --filter @qticaret/server-kit exec node --input-type=module
          -e 'import { generateIdentity, identityToRecipient } from "age-encryption";
          console.log(await identityToRecipient(await generateIdentity()))')" >> "$GITHUB_ENV"
      # What turbo already built, linted or tested with the same inputs is not
      # run again (adr/0081): a branch starts from dev's results. Entries a
      # week old go, so the folder does not grow with every run
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-static-${{ github.sha }}
          restore-keys: |
            turbo-static-
      - run: pnpm format:check
      # The backend's tsconfig includes the query and container types Medusa
      # writes when it builds (.medusa/types; `medusa develop` writes them
      # locally): typecheck and lint run after them, not beside them.
      # A build is a release build: the apps' configs validate as deployed
      # (NODE_ENV unset), so the control plane also needs a Redis address
      # (nothing connects at build)
      - run: pnpm turbo run build
        env:
          REDIS_URL: redis://localhost:6379
      # --continue: every failing package is reported, not only the first
      - run: pnpm turbo run lint typecheck --continue $TURBO_FILTER
        env:
          TURBO_FILTER: ${{ needs.changes.outputs.filter }}
      - name: Drop week-old turbo entries
        if: always()
        run: find .turbo/cache -type f -mtime +7 -delete 2>/dev/null || true

  # The unit tests, a group to a job, side by side (they took 19 minutes one
  # after another inside one job, adr/0081). Only the groups the push reaches
  # open (scripts/ci-unit-groups.mjs; all four on dev, main and a full run):
  # none reached, the job is skipped, which the gate counts as green
  unit:
    name: Unit tests (${{ matrix.group }})
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.unit != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.changes.outputs.unit) }}
    # The rate limiter's Redis counters (an atomic Lua script) are tested
    # against a real Redis; the same pinned image as local dev
    services:
      redis:
        image: redis:7.4.11-alpine@sha256:57e4255cc971b1c8d6f8a6ca283ac01bc3ecdd914273ef6bfaede87aaecd6541
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_REDIS_URL: redis://localhost:6379/15
      # The control plane validates its env wherever it reads it (its build,
      # and unit tests of code that reads it, such as the rate limiter's
      # identity key): a public-looking domain and an https panel pass both
      # as deployed and as local. Build-time values only; nothing is served
      PLATFORM_DOMAIN: qticaret-ci.dev
      CP_PANEL_URL: https://cp.qticaret-ci.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The changed packages are found against dev's history
          fetch-depth: 0
      # Product videos (adr/0069): the backend's unit tests run the real ffprobe
      # on clips ffmpeg makes in the test; without it they skip and say so
      # (first, before the job runs any of the repository's code: see the action)
      - uses: ./.github/actions/ffmpeg
        if: startsWith(matrix.group, 'backend')
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Random per run and useless outside this job; masked all the same,
      # since every later step lists its env in the (public) log
      # (the control plane's keys too: its `medusa build` validates its env)
      - name: Generate throwaway secrets
        run: |
          for name in JWT_SECRET COOKIE_SECRET PII_ENCRYPTION_KEY PII_HASH_KEY CREDENTIALS_ENCRYPTION_KEY \
            AUTH_MFA_ENCRYPTION_KEY CP_HASH_KEY CP_MASTER_KEY; do
            value="$(openssl rand -hex 32)"
            # Masking only tidies the log: the values are worthless outside this
            # job, so a branch that stops workflow commands exposes nothing
            # nosemgrep: yaml.github-actions.security.audit.unsafe-add-mask-workflow-command.unsafe-add-mask-workflow-command
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
      - run: pnpm install --frozen-lockfile
      # The control plane's escrow recipient: a public age key whose identity
      # is thrown away at once, so nothing sealed to it can ever be opened
      - name: Throwaway escrow recipient
        run: >-
          echo "CP_ESCROW_RECIPIENTS=$(pnpm --silent --filter @qticaret/server-kit exec node --input-type=module
          -e 'import { generateIdentity, identityToRecipient } from "age-encryption";
          console.log(await identityToRecipient(await generateIdentity()))')" >> "$GITHUB_ENV"
      # What turbo already built, linted or tested with the same inputs is not
      # run again (adr/0081): a branch starts from dev's results. Entries a
      # week old go, so the folder does not grow with every run
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-unit-${{ matrix.group }}-${{ github.sha }}
          restore-keys: |
            turbo-unit-${{ matrix.group }}-
      - name: Run the group's tests
        env:
          TURBO_FILTER: ${{ needs.changes.outputs.filter }}
          GROUP: ${{ matrix.group }}
        run: bash scripts/ci-unit.sh "$GROUP"
      - name: Drop week-old turbo entries
        if: always()
        run: find .turbo/cache -type f -mtime +7 -delete 2>/dev/null || true

  integration:
    name: Integration tests (${{ matrix.suite }})
    needs: changes
    # Only the suites the push reaches (scripts/ci-changes.sh lists them): the
    # backend's when its packages changed, the control plane's when it or a
    # workspace it depends on did. None reached: skipped, which the gate
    # counts as green
    if: needs.changes.outputs.integration != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # Backend: each HTTP spec file boots Medusa (~20 s) on a database and a
    # Redis namespace of its own, so files run side by side: three jest
    # workers on a runner's four cores, eight shards of ~50 files (adr/0081;
    # before, twelve shards of one worker each left three cores idle and
    # filled the account's twenty job slots). "HTTP k/8" and "modules".
    # Control plane (apps/control-plane, adr/0081 Ek 2026-11-25 (3)): its
    # HTTP files on one worker, two shards ("control plane k/2")
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.changes.outputs.integration) }}
    services:
      postgres:
        image: postgres:16.15-alpine@sha256:f4610795587492cd4fb887c2dc3de301b813278bb6f616992061141b5f15ac36
        env:
          # Ephemeral, job-scoped container: no password to manage or leak
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: qticaret
        ports:
          - 5432:5432
        # The data in memory: every spec file makes and migrates a database, and
        # nothing of it outlives the job (adr/0081)
        options: >-
          --tmpfs /var/lib/postgresql/data --shm-size 1g
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USERNAME: postgres
      DB_PASSWORD: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Product videos (adr/0069): the video upload suite needs ffmpeg and
      # ffprobe on the server; any backend HTTP shard may hold it
      # (first, before the job runs any of the repository's code: see the action)
      - uses: ./.github/actions/ffmpeg
        if: startsWith(matrix.suite, 'HTTP ')
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Random per run and useless outside this job; masked all the same,
      # since every later step lists its env in the (public) log. Staff 2FA
      # (adr/0040) needs its sealing key: the 2FA and team suites turn it on.
      # The control plane's keys too (its env schema requires them)
      - name: Generate throwaway secrets
        run: |
          for name in JWT_SECRET COOKIE_SECRET PII_ENCRYPTION_KEY PII_HASH_KEY CREDENTIALS_ENCRYPTION_KEY \
            AUTH_MFA_ENCRYPTION_KEY CP_HASH_KEY CP_MASTER_KEY; do
            value="$(openssl rand -hex 32)"
            # Masking only tidies the log: the values are worthless outside this
            # job, so a branch that stops workflow commands exposes nothing
            # nosemgrep: yaml.github-actions.security.audit.unsafe-add-mask-workflow-command.unsafe-add-mask-workflow-command
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
      - run: pnpm install --frozen-lockfile
      # The control plane's escrow recipient: a public age key whose identity
      # is thrown away at once, so nothing sealed to it can ever be opened
      - name: Throwaway escrow recipient
        if: startsWith(matrix.suite, 'control plane')
        run: >-
          echo "CP_ESCROW_RECIPIENTS=$(pnpm --silent --filter @qticaret/server-kit exec node --input-type=module
          -e 'import { generateIdentity, identityToRecipient } from "age-encryption";
          console.log(await identityToRecipient(await generateIdentity()))')" >> "$GITHUB_ENV"
      # Backend: three jest workers, each replaced when its heap grows (jest.config.js).
      # Control plane: one worker (its package.json); its panel's origin and the
      # platform domain its tests expect (`<slug>.localhost`); its scheduled jobs
      # stay off in the tests (integration-tests/setup.js)
      - name: Run the suite
        env:
          SUITE: ${{ matrix.suite }}
          JEST_WORKERS: "3"
          # HTTP spec files share one Medusa boot eight at a time; the modules
          # suite ignores it (apps/backend/integration-tests/bundle/README.md)
          QT_IT_BUNDLE: "8"
        run: |
          set -o pipefail
          case "$SUITE" in
            modules)
              pnpm --filter @qticaret/backend test:integration:modules 2>&1 | tee suite.log
              ;;
            "control plane "*)
              ADMIN_CORS=http://localhost:5174 AUTH_CORS=http://localhost:5174 \
                CP_PANEL_URL=http://localhost:5174 PLATFORM_DOMAIN=localhost \
                pnpm --filter @qticaret/control-plane test:integration:http --shard="${SUITE#control plane }" 2>&1 | tee suite.log
              ;;
            *)
              pnpm --filter @qticaret/backend test:integration:http --shard="${SUITE#HTTP }" 2>&1 | tee suite.log
              ;;
          esac
      # A test that passed only on its second try (the backend's
      # integration-tests/plain-failures.js, the control plane's retry.js)
      # is named in the run's summary: it is to be mended, not forgotten
      - name: Name the tests that needed a second try
        if: always()
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          retried="$(grep -oE 'LOGGING RETRY ERRORS.*' suite.log 2>/dev/null | sed 's/LOGGING RETRY ERRORS *//' | sort -u || true)"
          if [ -n "$retried" ]; then
            { echo "### Tried twice ($SUITE)"; echo '```'; echo "$retried"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

  e2e:
    name: Panel e2e (smoke, accessibility ${{ matrix.group }}/2)
    needs: changes
    # Skipped on a branch that touches only the storefront and its theme packages
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    # In one job the 132 tests took 11.6 minutes on two workers after ~3 minutes
    # of setup, the longest link of a full run (adr/0081 Ek). Two jobs, the
    # files split by measured time (E2E_GROUP, apps/panel/e2e/playwright.config.ts:
    # group 1 the files named there, group 2 every other file; an even count,
    # as --shard cuts, left one job at 6 minutes and the other at 11 to 14).
    # Each job signs its own temporary admin in and out (setup and teardown).
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        group: ["1", "2"]
    # A real backend on a fresh database with the demo shop; the panel, built and
    # served by `vite preview`, proxies to it (apps/panel/e2e)
    services:
      postgres:
        image: postgres:16.15-alpine@sha256:f4610795587492cd4fb887c2dc3de301b813278bb6f616992061141b5f15ac36
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: qticaret
        ports:
          - 5432:5432
        # The data in memory: every spec file makes and migrates a database, and
        # nothing of it outlives the job (adr/0081)
        options: >-
          --tmpfs /var/lib/postgresql/data --shm-size 1g
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4.11-alpine@sha256:57e4255cc971b1c8d6f8a6ca283ac01bc3ecdd914273ef6bfaede87aaecd6541
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Product videos (adr/0069): the backend checks ffmpeg once at start (uploads stay
      # closed without it) and product-video.e2e.ts makes its clip with it
      # (first, before the job runs any of the repository's code: see the action)
      - uses: ./.github/actions/ffmpeg
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Generate throwaway secrets
        run: |
          for name in JWT_SECRET COOKIE_SECRET PII_ENCRYPTION_KEY PII_HASH_KEY CREDENTIALS_ENCRYPTION_KEY; do
            value="$(openssl rand -hex 32)"
            # Masking only tidies the log: the values are worthless outside this
            # job, so a branch that stops workflow commands exposes nothing
            # nosemgrep: yaml.github-actions.security.audit.unsafe-add-mask-workflow-command.unsafe-add-mask-workflow-command
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
      - run: pnpm install --frozen-lockfile
      # The browser and the system libraries it needs come from the Actions
      # cache (adr/0081): from the network they took up to nine minutes
      - id: playwright
        run: |
          echo "version=$(pnpm --silent --filter @qticaret/panel exec playwright --version | tr -dc '0-9.')" >> "$GITHUB_OUTPUT"
          echo "image=${ImageVersion:-none}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: libraries
        with:
          path: ~/.cache/qt-debs/playwright
          key: debs-playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-${{ steps.playwright.outputs.image }}
      - name: Install Chromium's system libraries
        run: |
          packages="$(pnpm --silent --filter @qticaret/panel exec playwright install-deps --dry-run chromium \
            | grep -o 'install -y --no-install-recommends[^"]*' | sed 's/^install -y --no-install-recommends//')"
          # shellcheck disable=SC2086
          bash scripts/ci-debs.sh playwright $packages
      - name: Install Chromium for Playwright
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter @qticaret/panel exec playwright install chromium
      # Saved straight after the installs, before the job builds or tests anything
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.libraries.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/qt-debs/playwright
          key: debs-playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-${{ steps.playwright.outputs.image }}
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.browsers.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # Product videos (adr/0069): the backend checks ffmpeg once at start (uploads stay
      # closed without it) and product-video.e2e.ts makes its clip with it. Ubuntu 24.04's
      # package is 6.1 (the backend wants 7 and only warns; docs/08)
      - name: Database and demo shop
        run: |
          pnpm --filter @qticaret/backend medusa db:migrate
          pnpm --filter @qticaret/backend seed:demo
          # The cutlery pack, as the provisioner gives it: its ready-made looks are the
          # gallery's (looks.e2e.ts); general has none since Grafit was removed (2026-11-17)
          NODE_ENV=development pnpm --filter @qticaret/backend tenant:apply-pack pack=cutlery
          # A few days of orders: the order page's tests open one
          pnpm --filter @qticaret/backend seed:demo-orders days=3
      - name: Start the backend
        # Two browsers run ~120 tests from one address: past the admin's 1,200 requests a
        # minute per IP, /admin/users/me answered 429 and the panel showed its sign-in page
        # mid-run. LOAD_TEST scales per-IP limits up, on development only (lib/env.ts)
        # Turnstile (adr/0044 Ek 2026-11-24) runs with Cloudflare's test keys: the sign-in page's
        # widget gets the always-pass dummy token and the backend's siteverify accepts it
        env:
          NODE_ENV: development
          LOAD_TEST: "on"
        run: |
          pnpm --filter @qticaret/backend dev > backend.log 2>&1 &
          for attempt in $(seq 1 90); do
            if curl -fsS http://localhost:9000/health > /dev/null; then exit 0; fi
            sleep 2
          done
          # The end of it only: the log is public
          tail -n 100 backend.log
          exit 1
      # The panel built once and served by `vite preview`, which proxies to the backend as
      # the dev server does (preview.proxy defaults to server.proxy). The dev server serves
      # the app as separate, untransformed-until-asked modules on every one of the many page
      # loads the ~120 tests make, and the tests took 23 to over 38 minutes with it. Built in
      # development mode, so the i18n missing-key warnings the tests watch for stay on.
      # Playwright finds the server running and uses it (reuseExistingServer)
      - name: Build and serve the panel
        run: |
          pnpm --filter @qticaret/panel exec vite build --mode development
          pnpm --filter @qticaret/panel exec vite preview --port 5173 --strictPort > panel.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:5173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          tail -n 100 panel.log
          exit 1
      - run: pnpm --filter @qticaret/panel test:e2e
        env:
          E2E_GROUP: ${{ matrix.group }}
      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report-${{ matrix.group }}
          # The report and traces live in dot directories, which are left out by default.
          # Not the backend's log: the artifact is public and nothing proves every line
          # of a dev server's log (Medusa's own included) goes through our redaction
          include-hidden-files: true
          path: |
            apps/panel/e2e/.report
            apps/panel/e2e/.results
          retention-days: 7

  # The one result a merge waits for (adr/0081): green when every job that
  # ran is green; a job the push did not need is skipped and counts as green.
  gate:
    name: CI
    if: always()
    needs: [changes, static, unit, integration, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job that ran is green
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != success ] && [ "$result" != skipped ]; then
              echo "::error::a job ended as $result"
              exit 1
            fi
          done
