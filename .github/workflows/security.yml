# Security scans (F0.7, docs/04): secrets, dependency audit, SAST, Trivy and
# SBOM. Critical findings fail the build. Every tool is pinned by commit SHA,
# image digest or checksum: scanners run with access to the repository, and
# trivy-action itself was tag-hijacked in March 2026 (CVE-2026-33634).
name: Security

on:
  push:
  schedule:
    - cron: "0 5 * * 1" # Mondays 08:00 Europe/Istanbul, on the default branch
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: "0"
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa

jobs:
  gitleaks:
    name: Secret scan (full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (checksum verified)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan full git history
        run: $RUNNER_TEMP/gitleaks git --redact --no-banner --verbose .

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Lists every advisory; only critical ones fail (docs/04)
      - run: pnpm audit --audit-level critical
      - name: SBOM (CycloneDX)
        run: pnpm sbom --sbom-format cyclonedx --lockfile-only --prod > sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 90

  semgrep:
    name: SAST (Semgrep CE)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:1.180.0@sha256:529ee8a277ec8adc5b534d7c74eea0a47e9de21d62852b6ba7ac6ba9566845c3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: >-
          semgrep scan --metrics=off --error
          --config p/typescript --config p/javascript --config p/nodejs
          --config p/secrets --config p/github-actions --config p/docker-compose

  trivy:
    name: Trivy (dependencies, misconfiguration)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Image scanning joins once the production Dockerfile exists (F16)
      - name: Report HIGH and CRITICAL
        run: >-
          docker run --rm -v "$PWD:/src:ro" -v trivy-cache:/root/.cache "$TRIVY_IMAGE"
          fs --scanners vuln,misconfig --include-dev-deps --skip-dirs "**/node_modules" --severity HIGH,CRITICAL /src
      - name: Fail on CRITICAL
        run: >-
          docker run --rm -v "$PWD:/src:ro" -v trivy-cache:/root/.cache "$TRIVY_IMAGE"
          fs --scanners vuln,misconfig --include-dev-deps --skip-dirs "**/node_modules" --severity CRITICAL --exit-code 1 --quiet /src
